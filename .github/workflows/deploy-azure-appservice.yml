name: Deploy to Azure App Service (Container)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push image to ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          IMAGE=${{ secrets.ACR_NAME }}.azurecr.io/nextjs-app:latest
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Update Web App to use new container image
        run: |
          az webapp config container set --name ${{ secrets.WEBAPP_NAME }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --docker-custom-image-name ${{ secrets.ACR_NAME }}.azurecr.io/nextjs-app:latest
